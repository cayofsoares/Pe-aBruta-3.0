<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Aprovado | PEÇA BRUTA</title>
    <link rel="stylesheet" href="css/sucesso.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="sucesso-container">
        <div class="icon-box">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="titulo-sucesso">PAGAMENTO APROVADO!</h1>
        <p class="mensagem">A sua compra foi processada com sucesso. O vendedor já foi notificado e começará a preparar o seu pedido.</p>

        <div class="resumo-pedido">
            <h3>Resumo da Compra</h3>
            <p><strong>Produto:</strong> <span id="sucessoNomeProduto">Carregando...</span></p>
            <p><strong>Total Pago:</strong> <span id="sucessoPrecoProduto">R$ 0,00</span></p>
        </div>

        <button class="btn-voltar" onclick="window.location.href='feed.html'">VOLTAR AO CATÁLOGO</button>
    </div>

    <script src="JS/sucesso.js"></script>
</body>
</html>
