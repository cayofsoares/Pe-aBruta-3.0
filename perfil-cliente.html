<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | PEÇA BRUTA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff4d00;
            --primary-hover: #e64500;
            --primary-glow: rgba(255, 77, 0, 0.15);
            --bg: #050505;
            --card: #0a0a0a;
            --border: #1a1a1a;
            --text: #ffffff;
            --text-dim: #888;
            --danger: #ff3333;
        }

        * { box-sizing: border-box; outline: none; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar {
            width: 100%; height: 70px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-family: 'Orbitron'; font-size: 22px; font-weight: 900; text-decoration: none; color: #fff; letter-spacing: 2px; }
        .logo span { color: var(--primary); }
        .btn-back { color: var(--text-dim); text-decoration: none; font-size: 11px; font-family: 'Orbitron'; border: 1px solid var(--border); padding: 10px 20px; border-radius: 5px; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase; }
        .btn-back:hover { color: #fff; border-color: var(--primary); background: var(--primary-glow); }

        /* CONTAINER PRINCIPAL */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .page-header {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .page-header h1 {
            font-family: 'Orbitron';
            font-size: 28px;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
        }
        .badge-type {
            background: rgba(255, 77, 0, 0.1);
            color: var(--primary);
            font-size: 10px;
            font-family: 'Orbitron';
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* GRID DO PERFIL */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        /* CARDS */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: var(--border);
            transition: 0.3s;
        }
        .card:hover::before { background: var(--primary); }
        
        .card-header {
            font-family: 'Orbitron';
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* FORMULÁRIOS & INPUTS */
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block; font-size: 11px; font-weight: 700; color: var(--text-dim);
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
        }
        .input-group input, .input-group select {
            width: 100%; padding: 14px; background: #050505; border: 1px solid #222;
            border-radius: 4px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px;
            transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary); box-shadow: 0 0 10px rgba(255, 77, 0, 0.1);
        }
        
        /* Estilo específico para campos somente leitura */
        .input-group input[readonly] {
            background: #000; 
            color: #666; 
            cursor: not-allowed; 
            border-color: #111;
        }
        .input-group input[readonly]:focus {
            border-color: #111; box-shadow: none;
        }

        /* BOTOES */
        .btn {
            padding: 12px 20px; border: none; border-radius: 4px; font-family: 'Orbitron'; font-weight: 900;
            font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 5px 15px var(--primary-glow); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .btn-danger { color: var(--danger); background: transparent; padding: 5px; font-size: 14px; }
        .btn-danger:hover { color: #ff0000; transform: scale(1.1); }
        .btn-edit { color: var(--primary); background: transparent; padding: 5px; font-size: 14px; }
        .btn-edit:hover { color: var(--primary-hover); transform: scale(1.1); }

        /* LISTA DE ENDEREÇOS */
        .address-list {
            display: flex; flex-direction: column; gap: 15px;
        }
        .address-card {
            background: #050505; border: 1px solid #222; border-radius: 6px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .address-card:hover { border-color: #444; }
        .address-info h4 { margin: 0 0 5px 0; font-size: 14px; color: #fff; font-family: 'Orbitron'; }
        .address-info p { margin: 0; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
        .address-actions { display: flex; gap: 10px; }
        .empty-address { text-align: center; padding: 40px; color: var(--text-dim); font-size: 13px; font-style: italic; border: 1px dashed #333; border-radius: 6px; }

        /* MODAL */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #0a0a0a; border: 1px solid var(--primary); border-radius: 8px;
            padding: 30px; width: 100%; max-width: 500px; position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .modal-title { font-family: 'Orbitron'; color: #fff; margin: 0 0 20px 0; font-size: 18px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .btn-close-modal { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: #888; font-size: 18px; cursor: pointer; transition: 0.3s;}
        .btn-close-modal:hover { color: var(--danger); }
        
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .row-3-1 { display: grid; grid-template-columns: 3fr 1fr; gap: 15px; }

        @media (max-width: 768px) {
            .profile-grid { grid-template-columns: 1fr; }
            .row-2, .row-3-1 { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="feed.html" class="logo">PEÇA<span>BRUTA</span></a>
        <a href="feed.html" class="btn-back">VOLTAR AO FEED</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>MEU PERFIL</h1>
            <span class="badge-type">CLIENTE</span>
        </div>

        <div class="profile-grid">
            
            <!-- DADOS PESSOAIS (SOMENTE LEITURA - SEM SENHA / SEM FOTO) -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fas fa-id-card"></i> DADOS PESSOAIS</span>
                </div>
                
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" id="perfilNome" readonly title="Dado protegido (Autenticado via API)">
                </div>
                
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="perfilEmail" readonly title="Dado protegido (Autenticado via API)">
                </div>
                
                <div class="input-group">
                    <label>Telefone / WhatsApp</label>
                    <input type="text" id="perfilTelefone" readonly title="Dado protegido">
                </div>
                
                <div class="input-group">
                    <label>CPF</label>
                    <input type="text" id="perfilCpf" readonly title="Dado imutável" style="font-family: 'Orbitron'; letter-spacing: 1px;">
                </div>
            </div>

            <!-- ENDEREÇOS (COMUNICAÇÃO COM O MONGODB) -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fas fa-map-marker-alt"></i> MEUS ENDEREÇOS</span>
                    <button class="btn btn-primary" onclick="abrirModalEndereco()">
                        <i class="fas fa-plus"></i> ADICIONAR
                    </button>
                </div>

                <div class="address-list" id="listaEnderecos">
                    <div class="empty-address">Buscando endereços com segurança...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE ENDEREÇO -->
    <div id="modalEndereco" class="modal-overlay">
        <div class="modal-content">
            <button class="btn-close-modal" onclick="fecharModal()"><i class="fas fa-times"></i></button>
            <h3 class="modal-title" id="modalEnderecoTitulo">ADICIONAR ENDEREÇO</h3>
            
            <form id="formEndereco" onsubmit="salvarEndereco(event)">
                <input type="hidden" id="endId">
                
                <div class="input-group">
                    <label>CEP</label>
                    <input type="text" id="endCep" placeholder="00000-000" maxlength="9" required onblur="buscarCep(this.value)" oninput="mascaraCEP(this)">
                </div>

                <div class="row-3-1">
                    <div class="input-group">
                        <label>Rua / Logradouro</label>
                        <input type="text" id="endRua" placeholder="Ex: Av. Paulista" required>
                    </div>
                    <div class="input-group">
                        <label>Número</label>
                        <input type="text" id="endNumero" placeholder="123" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Complemento (Opcional)</label>
                    <input type="text" id="endComplemento" placeholder="Apto, Bloco, etc...">
                </div>

                <div class="input-group">
                    <label>Bairro</label>
                    <input type="text" id="endBairro" placeholder="Bairro" required>
                </div>

                <div class="row-2">
                    <div class="input-group">
                        <label>Cidade</label>
                        <input type="text" id="endCidade" placeholder="Cidade" required>
                    </div>
                    <div class="input-group">
                        <label>Estado</label>
                        <select id="endEstado" required>
                            <option value="">Selecione...</option>
                            <option value="AC">Acre</option><option value="AL">Alagoas</option><option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option><option value="BA">Bahia</option><option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option><option value="ES">Espírito Santo</option><option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option><option value="MT">Mato Grosso</option><option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option><option value="PA">Pará</option><option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option><option value="PE">Pernambuco</option><option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option><option value="RN">Rio Grande do Norte</option><option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option><option value="RR">Roraima</option><option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option><option value="SE">Sergipe</option><option value="TO">Tocantins</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btnSalvarEndereco" style="width: 100%;">SALVAR ENDEREÇO</button>
            </form>
        </div>
    </div>

    <script>
        // --- SEGURANÇA OBRIGATÓRIA ---
        // Extrai o Token JWT de forma resiliente
        function obterTokenSeguro() {
            let token = sessionStorage.getItem('token'); 
            if (!token) {
                try {
                    const u = JSON.parse(sessionStorage.getItem('usuarioLogado'));
                    if (u && u.token) token = u.token;
                } catch(e) {}
            }
            if (!token) token = sessionStorage.getItem('usuarioLogado'); 
            return token;
        }

        // --- CARREGAMENTO DE DADOS PESSOAIS ---
        function carregarDadosPessoais() {
            const tokenStr = obterTokenSeguro();
            if(!tokenStr) {
                alert("Sessão expirada. Faça login novamente.");
                window.location.href = "login.html";
                return;
            }

            // Tentativa de carregar dados do usuário que foram salvos durante o login
            try {
                const userRaw = sessionStorage.getItem('usuarioLogado');
                let userData = null;
                
                if (userRaw) {
                    const parsed = JSON.parse(userRaw);
                    if (parsed.user) {
                        userData = parsed.user; // O backend retornou na chave 'user'
                    } else {
                        userData = parsed; // Fallback se salvo diretamente
                    }
                }

                if (userData) {
                    document.getElementById('perfilNome').value = userData.nome || "Visitante";
                    document.getElementById('perfilEmail').value = userData.email || "Nenhum e-mail";
                }
            } catch(e) {
                console.warn("Aviso: Formato do usuarioLogado no sessionStorage não reconhecido.");
            }

            // O CPF e o Telefone não são devolvidos abertamente pela rota atual de Login por questões de segurança.
            // Eles serão mascarados na interface do perfil e acessados nativamente no backend no momento do checkout.
            document.getElementById('perfilTelefone').value = "(**) *****-**** (Protegido)";
            document.getElementById('perfilCpf').value = "***.***.***-** (Protegido)";

            // Chama a API segura para carregar os endereços do usuário
            buscarEnderecosAPI();
        }

        // --- INTEGRAÇÃO OFICIAL COM API DE ENDEREÇOS ---
        let enderecosLocais = [];

        async function buscarEnderecosAPI() {
            try {
                // Utilizando IP 127.0.0.1 em vez de localhost para evitar falhas de CORS dependendo do navegador
                const response = await fetch('https://64xd3fbf-3000.brs.devtunnels.ms/api/enderecos', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${obterTokenSeguro()}` }
                });

                const data = await response.json();

                if (response.ok) {
                    enderecosLocais = data.enderecos || [];
                    renderizarEnderecos();
                } else {
                    tratarErroSessao(data.error);
                }
            } catch (err) {
                console.error("Erro ao buscar endereços da API:", err);
                document.getElementById('listaEnderecos').innerHTML = '<div class="empty-address" style="color:var(--danger)">Erro ao comunicar com o servidor. O backend está rodando?</div>';
            }
        }

        function renderizarEnderecos() {
            const container = document.getElementById('listaEnderecos');
            
            if (enderecosLocais.length === 0) {
                container.innerHTML = `<div class="empty-address">Nenhum endereço cadastrado.<br>Adicione endereços para agilizar sua solicitação de peças.</div>`;
                return;
            }

            container.innerHTML = enderecosLocais.map(end => `
                <div class="address-card">
                    <div class="address-info">
                        <h4>${end.rua}, ${end.numero} ${end.complemento ? ' - ' + end.complemento : ''}</h4>
                        <p>${end.bairro} - ${end.cidade}/${end.estado}</p>
                        <p>CEP: ${end.cep}</p>
                    </div>
                    <div class="address-actions">
                        <button class="btn btn-edit" title="Editar" onclick="abrirModalEndereco('${end._id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger" title="Excluir" onclick="excluirEnderecoAPI('${end._id}')"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function abrirModalEndereco(id = null) {
            document.getElementById('formEndereco').reset();
            document.getElementById('endId').value = '';
            document.getElementById('modalEnderecoTitulo').innerText = 'NOVO ENDEREÇO';

            if (id) {
                const end = enderecosLocais.find(e => e._id === id);
                if(end) {
                    document.getElementById('modalEnderecoTitulo').innerText = 'EDITAR ENDEREÇO';
                    document.getElementById('endId').value = end._id;
                    document.getElementById('endCep').value = end.cep;
                    document.getElementById('endRua').value = end.rua;
                    document.getElementById('endNumero').value = end.numero;
                    document.getElementById('endComplemento').value = end.complemento || '';
                    document.getElementById('endBairro').value = end.bairro;
                    document.getElementById('endCidade').value = end.cidade;
                    document.getElementById('endEstado').value = end.estado;
                }
            }
            document.getElementById('modalEndereco').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalEndereco').style.display = 'none';
        }

        async function salvarEndereco(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSalvarEndereco');
            const idInput = document.getElementById('endId').value;
            
            const payload = {
                cep: document.getElementById('endCep').value,
                rua: document.getElementById('endRua').value,
                numero: document.getElementById('endNumero').value,
                complemento: document.getElementById('endComplemento').value,
                bairro: document.getElementById('endBairro').value,
                cidade: document.getElementById('endCidade').value,
                estado: document.getElementById('endEstado').value
            };

            btn.disabled = true;
            btn.innerText = 'SALVANDO...';

            const url = idInput ? `https://64xd3fbf-3000.brs.devtunnels.ms/api/endereco/${idInput}` : 'https://64xd3fbf-3000.brs.devtunnels.ms/api/endereco/adicionar';
            const method = idInput ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${obterTokenSeguro()}`
                    },
                    body: JSON.stringify(payload) // Nenhum ID de usuário é passado no body. A segurança é via JWT.
                });
                
                const data = await response.json();
                
                if(response.ok) {
                    fecharModal();
                    buscarEnderecosAPI(); // Recarrega endereços validados do banco
                } else {
                    tratarErroSessao(data.error);
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexão com o servidor ao salvar o endereço.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'SALVAR ENDEREÇO';
            }
        }

        async function excluirEnderecoAPI(id) {
            if(confirm('Atenção: Tem certeza que deseja excluir este endereço de entrega?')) {
                try {
                    const response = await fetch(`https://64xd3fbf-3000.brs.devtunnels.ms/api/endereco/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${obterTokenSeguro()}` }
                    });
                    
                    const data = await response.json();

                    if(response.ok) {
                        buscarEnderecosAPI();
                    } else {
                        tratarErroSessao(data.error);
                    }
                } catch(err) {
                    console.error(err);
                    alert("Erro de conexão ao tentar excluir endereço.");
                }
            }
        }

        // Funções Globais de Tratamento e UX
        function tratarErroSessao(msgErro) {
            alert('Erro detectado: ' + (msgErro || 'Ação não permitida ou servidor inacessível.'));
            if(msgErro && (msgErro.toLowerCase().includes('sessão expirada') || msgErro.toLowerCase().includes('token'))) {
                sessionStorage.removeItem('usuarioLogado');
                sessionStorage.removeItem('token');
                window.location.href = 'login.html';
            }
        }

        async function buscarCep(cep) {
            const cleanCep = cep.replace(/\D/g, '');
            if (cleanCep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cleanCep}/json/`);
                    const data = await response.json();
                    if (!data.erro) {
                        document.getElementById('endRua').value = data.logradouro;
                        document.getElementById('endBairro').value = data.bairro;
                        document.getElementById('endCidade').value = data.localidade;
                        document.getElementById('endEstado').value = data.uf;
                        document.getElementById('endNumero').focus();
                    }
                } catch (error) {
                    console.warn('Falha na API ViaCEP (Não impeditivo).', error);
                }
            }
        }

        function mascaraCEP(input) {
            let v = input.value.replace(/\D/g, '');
            if(v.length > 5) v = v.replace(/^(\d{5})(\d)/, "$1-$2");
            input.value = v;
        }

        // Gatilho de inicialização
        window.onload = carregarDadosPessoais;
    </script>
</body>
</html>
