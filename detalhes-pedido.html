<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Pedido | PEÇA BRUTA</title>
    <link rel="stylesheet" href="css/painel-lojista.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        .pedido-container { max-width: 850px; margin: 40px auto; padding: 20px; }
        .grid-detalhes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card-info { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 25px; border-radius: 4px; }
        .card-info h3 { font-family: 'Orbitron'; font-size: 14px; color: #ff4d00; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }

        .logistic-box {
            grid-column: 1 / -1;
            background: #111;
            border: 1px solid #ff4d00;
            padding: 25px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .logistic-box h3 { font-family: 'Orbitron'; color: #fff; margin-bottom: 20px; font-size: 14px; }

        .input-row-log {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .group { display: flex; flex-direction: column; }
        .group label { font-size: 10px; color: #666; font-family: 'Orbitron'; margin-bottom: 8px; }
        
        .group input {
            background: #000;
            border: 1px solid #333;
            padding: 12px;
            color: #fff;
            outline: none;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #000;
            padding: 15px;
            border: 1px solid #222;
        }

        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; }
        .radio-option input { accent-color: #ff4d00; }

        .btn-confirmar-envio {
            background: #ff4d00;
            color: #fff;
            border: none;
            padding: 18px;
            font-family: 'Orbitron';
            font-weight: 900;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <header class="painel-header">
        <a href="painel-lojista.html" class="back-link">← VOLTAR AOS PEDIDOS</a>
        <div class="logo">PEÇA<span>BRUTA</span></div>
        <div class="shop-badge">DETALHES DO PEDIDO</div>
    </header>

    <div class="pedido-container">
        <div class="grid-detalhes">
            
            <div class="card-info">
                <h3>Comprador</h3>
                <p style="font-size: 14px; font-weight: 800;">Cayo Ferreira</p>
                <p style="font-size: 12px; color: #888; margin-top: 5px;">Av. Paulista, 1000 - São Paulo/SP</p>
            </div>

            <div class="card-info">
                <h3>Item Vendido</h3>
                <p style="font-size: 14px; font-weight: 800;">Diferencial Dana 44</p>
                <p style="color: #ff4d00; font-size: 12px;">Seu Recebimento: R$ 3.150,00</p>
            </div>

            <div class="logistic-box">
                <h3>DEFINIR LOGÍSTICA</h3>
                
                <form id="formEnvio">
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="tipoEnvio" value="rastreio" checked onclick="toggleRastreio(true)">
                            Com Código de Rastreio
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="tipoEnvio" value="direto" onclick="toggleRastreio(false)">
                            Entrega Direta (Sem Rastreio)
                        </label>
                    </div>

                    <div class="input-row-log">
                        <div class="group">
                            <label>PRAZO PARA CHEGAR (DIAS ÚTEIS)</label>
                            <input type="number" id="prazoDias" placeholder="Ex: 4" required>
                        </div>
                        
                        <div class="group" id="boxRastreio">
                            <label>CÓDIGO DE RASTREIO</label>
                            <input type="text" id="codigoRastreio" placeholder="Digite o código aqui">
                        </div>
                    </div>

                    <button type="submit" class="btn-confirmar-envio">ATUALIZAR STATUS DO PEDIDO</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleRastreio(mostrar) {
            const box = document.getElementById('boxRastreio');
            const input = document.getElementById('codigoRastreio');
            if (mostrar) {
                box.style.opacity = "1";
                box.style.pointerEvents = "auto";
                input.required = true;
            } else {
                box.style.opacity = "0.3";
                box.style.pointerEvents = "none";
                input.value = "";
                input.required = false;
            }
        }

        document.getElementById('formEnvio').onsubmit = function(e) {
            e.preventDefault();
            alert("Pedido atualizado! O comprador já pode ver o prazo de entrega.");
            window.location.href = 'painel-lojista.html';
        };
    </script>
</body>
</html>
